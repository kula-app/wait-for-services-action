name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full semver version to release (e.g. 1.3.0). The v1 and v1.3 tags are moved to match.'
        required: true
        type: string

# Only one release may run at a time to avoid racing tag moves.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      minor_tag: ${{ steps.metadata.outputs.minor_tag }}
      major_tag: ${{ steps.metadata.outputs.major_tag }}
    steps:
      - name: Validate version and derive tags
        id: metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be a full semver 'X.Y.Z' (got '$VERSION')"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"; MINOR="${MINOR%.*}"

          {
            echo "version=$VERSION"
            echo "tag_name=v$VERSION"
            echo "minor_tag=v$MAJOR.$MINOR"
            echo "major_tag=v$MAJOR"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing v$VERSION (moving floating tags v$MAJOR.$MINOR and v$MAJOR)"

      - name: Ensure tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::tag $TAG_NAME already exists; releases are immutable"
            exit 1
          fi
          echo "$TAG_NAME is available"

  release:
    name: Create Release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KULA_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KULA_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git diff --name-only '*/dist/')" ]; then
            echo "::error::dist/ is out of date on main. Run 'yarn build' and commit before releasing."
            git diff --stat '*/dist/'
            exit 1
          fi

      # Pushing the vX.Y.Z tag with the App token (not GITHUB_TOKEN) is what
      # triggers build-and-push.yml to publish the container as X.Y.Z / X.Y / X / latest.
      - name: Create and push tags
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          MINOR_TAG: ${{ needs.prepare.outputs.minor_tag }}
          MAJOR_TAG: ${{ needs.prepare.outputs.major_tag }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          git config user.name "$APP_SLUG[bot]"
          git config user.email "${{ vars.KULA_RELEASE_BOT_APP_ID }}+$APP_SLUG[bot]@users.noreply.github.com"

          SHA="$(git rev-parse HEAD)"
          echo "Tagging $SHA"

          git tag "$TAG_NAME" "$SHA"
          git tag -f "$MINOR_TAG" "$SHA"
          git tag -f "$MAJOR_TAG" "$SHA"

          # Push the immutable patch tag first so build-and-push.yml fires,
          # then force-move the floating major/minor tags.
          git push origin "$TAG_NAME"
          git push -f origin "$MINOR_TAG" "$MAJOR_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.tag_name }}
          generate_release_notes: true
          make_latest: true
          token: ${{ steps.app-token.outputs.token }}

  release-required-check:
    name: Release - Required Check
    needs:
      - prepare
      - release
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the release jobs has failed." && exit 1
